# Extraction experiments. The Jev evaluator is fixed for every experiment and
# uses TYPESAFE_API_KEY, TYPESAFE_MODEL, and TYPESAFE_ENDPOINT from config.
# OCR and chat stay fixed so this matrix compares metadata models only.
experiments:
  - name: "deepseek-v4.1-flash"
    agent_class: "paperless_ai.agents.smart_graph_agent.SmartDocumentAgent"
    ocr_model: "google/gemini-3.5-flash-lite"
    ocr_temperature: 1.0
    ocr_reasoning_effort: "minimal"
    metadata_model: "deepseek/deepseek-v4.1-flash"
    metadata_temperature: 1.0
    metadata_reasoning_effort: "minimal"
    chat_model: "google/gemini-3.5-flash-lite"

