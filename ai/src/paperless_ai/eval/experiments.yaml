# Extraction experiments. The Jev evaluator is fixed for every experiment and
# uses TYPESAFE_API_KEY, TYPESAFE_MODEL, and TYPESAFE_ENDPOINT from config.
experiments:
  - name: "nanonets-ocr-gemini-3.1-flash-lite-metadata"
    agent_class: "paperless_ai.agents.smart_graph_agent.SmartDocumentAgent"
    ocr_model: "openai/nanonets/Nanonets-OCR2-3B"
    ocr_endpoint: "http://complex.home.arpa:8100/v1"
    ocr_max_image_dimension: 1920
    ocr_temperature: 0.0
    ocr_reasoning_effort: null
    metadata_model: "gemini/gemini-3.1-flash-lite"
    metadata_temperature: 1.0
    metadata_reasoning_effort: "minimal"

  - name: "nanonets-ocr-deepseek-v4-flash-latest-metadata"
    agent_class: "paperless_ai.agents.smart_graph_agent.SmartDocumentAgent"
    ocr_model: "openai/nanonets/Nanonets-OCR2-3B"
    ocr_endpoint: "http://complex.home.arpa:8100/v1"
    ocr_max_image_dimension: 1920
    ocr_temperature: 0.0
    ocr_reasoning_effort: null
    metadata_model: "openrouter/~deepseek/deepseek-v4-flash-latest"
    metadata_temperature: 1.0
    metadata_reasoning_effort: "minimal"
    metadata_response_format: "none"
