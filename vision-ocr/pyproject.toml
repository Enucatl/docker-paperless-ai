[project]
name = "vision-ocr"
version = "0.1.0"
description = "Complete-PDF layout-parsing adapter for OpenAI-compatible vision models"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "PyMuPDF>=1.25",
    "pydantic-settings>=2.0",
    "shared-inference",
    "niquests>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.28", "ruff>=0.15.10"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.sources]
shared-inference = { git = "https://github.com/Enucatl/shared-inference.git", branch = "main" }
