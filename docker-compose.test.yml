# docker-compose.test.yml — E2E test override for paperless-ai.
#
# Usage (via run_tests.sh):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml ...
#
# Ephemeral strategy:
#   - db and broker use tmpfs (RAM-disk) — disappears the instant the container stops,
#     no named volumes to clean up even if the script is Ctrl+C'd.
#   - webserver uses writable tmpfs directories owned by its non-root user.
#   - Dummy LLM keys prevent real API calls even if a mock is accidentally skipped.

services:
  db:
    userns_mode: host
    # RAM-disk: lightning-fast Django migrations, zero disk residue.
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql:mode=777,uid=999,gid=999
    secrets: !reset []
    healthcheck:
      interval: 1s
      start_period: 60s

  broker:
    userns_mode: host
    # Ephemeral Redis needs no disk persistence (the hardened user cannot write /data).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes: !reset []
    tmpfs:
      - /data
    healthcheck:
      interval: 1s
      start_period: 60s

  phoenix:
    userns_mode: host
    networks: !override [internal]
    labels: !override
      traefik.enable: "false"
    # Keep test traces in temporary SQLite storage; no production DB account.
    command: ["-m", "phoenix.server.main", "serve"]
    environment: !override
      PHOENIX_WORKING_DIR: /tmp/phoenix
    volumes: !reset []
    secrets: !reset []
    healthcheck:
      interval: 1s

  webserver:
    userns_mode: host
    networks: !override [internal]
    labels: !override
      traefik.enable: "false"
    healthcheck:
      interval: 1s
      start_period: 60s
    # Non-root Paperless needs writable ephemeral directories even with userns=host.
    volumes: !reset []
    secrets: !reset []
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
      - /run:rw,exec,nosuid,size=16m,mode=1777
      - /usr/src/paperless/data:uid=1000,gid=1000,mode=700
      - /usr/src/paperless/media:uid=1000,gid=1000,mode=700
      - /usr/src/paperless/export:uid=1000,gid=1000,mode=700
      - /usr/src/paperless/consume:uid=1000,gid=1000,mode=700
    environment:
      # The ephemeral database has no production API token for these services.
      - PAPERLESS_API_TOKEN_FILE=
      - PAPERLESS_USE_API_CONSUMER=
      - PAPERLESS_USE_API_SCHEDULER=
      # Keep a ready worker: lean autoscaling can exceed the upload test deadline.
      - PAPERLESS_USE_LEAN_WORKER=
      # Auto-create the admin user on first boot (idempotent on subsequent boots).
      - PAPERLESS_ADMIN_USER=admin
      - PAPERLESS_ADMIN_PASSWORD=admin
      - PAPERLESS_ADMIN_MAIL=admin@localhost
      - PAPERLESS_SECRET_KEY=test-secret-key-not-for-production
      - PAPERLESS_URL=http://webserver:8000
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_CLASSIFIER_ENABLED=false
      - PAPERLESS_LOCAL_OCR_ENABLED=false
      - PAPERLESS_AI_ALLOWED=false
      # Reuse the test consumer; Paperless otherwise respawns it after every upload.
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=100
      # Allow Paperless to POST webhooks to internal Docker hostnames
      # (webhook-listener is on the same Docker network as webserver).
      - PAPERLESS_ALLOWED_HOSTS=*
      - PAPERLESS_CORS_ALLOWED_HOSTS=http://webserver:8000
      # Use the image's CA bundle; empty now falls back to the source directory.
      - PAPERLESS_EMAIL_CERTIFICATE_LOCATION=/etc/ssl/certs/ca-certificates.crt

  # Webhook listener — receives document events and pushes to Redis DB 1.
  webhook-listener:
    userns_mode: host
    command: >
      bash -ec '
        PAPERLESS_TOKEN=$$(python /app/fetch_paperless_token.py)
        export PAPERLESS_TOKEN
        exec python -m paperless_listener.server
      '
    environment:
      - REDIS_URL=redis://broker:6379/1
      - PAPERLESS_URL=http://webserver:8000
      - PAPERLESS_TOKEN_FILE=
      - WEBHOOK_SECRET=test-secret-key-12345
      - WEBHOOK_SECRET_FILE=
      - TEST_PAPERLESS_USER=admin
      - TEST_PAPERLESS_PASS=admin
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 5s
      retries: 15
    depends_on:
      broker:
        condition: service_healthy
      webserver:
        condition: service_healthy

  ai:
    userns_mode: host
    # Keep test DNS and routes separate from the live stack's shared proxy network.
    networks: !override [internal]
    labels: !override
      traefik.enable: "false"
    healthcheck:
      interval: 1s
    command: >
      bash -ec '
        PAPERLESS_TOKEN=$$(python /app/fetch_paperless_token.py)
        export PAPERLESS_TOKEN
        exec python -m paperless_ai.search.copilot_server
      '
    environment:
      - PAPERLESS_URL=http://webserver:8000
      - PAPERLESS_TOKEN_FILE=
      - WEBHOOK_SECRET=test-secret-key-12345
      - WEBHOOK_SECRET_FILE=
      - MANAGE_PAPERLESS_WORKFLOWS=false
      # Tests invoke batches directly and inspect queues before any worker drains them.
      - POLL_INTERVAL=86400
      # The test database is ephemeral; use its existing test role instead of
      # provisioning the production-only dedicated role and secret.
      - CHAT_DATABASE_URL=postgresql://paperless@db:5432/paperless
      - CHAT_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - CHAT_DATABASE_PASSWORD_FILE=
      # Dummy keys guarantee no real LLM API calls even if a mock is misconfigured.
      - GOOGLE_API_KEY=dummy-test-key
      - ANTHROPIC_API_KEY=dummy-test-key
      - OPENAI_API_KEY=dummy-test-key
      - INFERENCE_METADATA_MODEL=gemini/gemini-2.5-flash
      - INFERENCE_CHAT_MODEL=gemini/gemini-2.5-flash
      - INFERENCE_OCR_ENDPOINT=http://document-service.invalid
      - INFERENCE_METADATA_ENDPOINT=
      - INFERENCE_CHAT_ENDPOINT=
      # Redis queue (DB 1)
      - REDIS_URL=redis://broker:6379/1
      - TEST_PAPERLESS_USER=admin
      - TEST_PAPERLESS_PASS=admin
    # secrets: [] moved to override if needed, but not needed in tests
    depends_on:
      webserver:
        condition: service_healthy
      webhook-listener:
        condition: service_healthy
    secrets: !reset
      - paperless_token
      - webhook_secret
      - openai_api_key
      - anthropic_api_key
      - google_api_key
      - openrouter_api_key
      - hf_token

  ai-test:
    userns_mode: host
    build:
      context: .
      dockerfile: ./ai/Dockerfile
      target: test
    entrypoint: []
    command: python -m pytest -q --maxfail=1 --durations=10 -o cache_dir=/tmp/pytest-cache /app/tests/
    environment:
      - PAPERLESS_URL=http://webserver:8000
      - MANAGE_PAPERLESS_WORKFLOWS=false
      - CHAT_DATABASE_URL=postgresql://paperless@db:5432/paperless
      - CHAT_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - CHAT_DATABASE_PASSWORD_FILE=
      - PAPERLESS_TOKEN_FILE=
      - GOOGLE_API_KEY=dummy-test-key
      - ANTHROPIC_API_KEY=dummy-test-key
      - OPENAI_API_KEY=dummy-test-key
      - INFERENCE_METADATA_MODEL=gemini/gemini-2.5-flash
      - INFERENCE_CHAT_MODEL=gemini/gemini-2.5-flash
      - INFERENCE_OCR_ENDPOINT=http://document-service.invalid
      - INFERENCE_METADATA_ENDPOINT=
      - INFERENCE_CHAT_ENDPOINT=
      - REDIS_URL=redis://broker:6379/1
      - WEBHOOK_URL=http://webhook-listener:8001
      - COPILOT_URL=http://ai:8001
      - TEST_PAPERLESS_USER=admin
      - TEST_PAPERLESS_PASS=admin
    depends_on:
      webserver:
        condition: service_healthy
      webhook-listener:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - internal
