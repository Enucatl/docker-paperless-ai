# Extraction experiments. The Jev evaluator is fixed for every experiment and
# uses TYPESAFE_API_KEY, TYPESAFE_MODEL, and TYPESAFE_ENDPOINT from config.
# Keep this smoke-test configuration deliberately small: the default code-test
# evaluation should exercise one hosted model with no local-model dependency.
experiments:
  - name: "gemini-3.5-flash-lite"
    agent_class: "paperless_ai.agents.smart_graph_agent.SmartDocumentAgent"
    ocr_model: "gemini/gemini-3.5-flash-lite"
    ocr_temperature: 1.0
    ocr_reasoning_effort: "minimal"
    metadata_model: "gemini/gemini-3.5-flash-lite"
    metadata_temperature: 1.0
    metadata_reasoning_effort: "minimal"
    chat_model: "gemini/gemini-3.5-flash-lite"
